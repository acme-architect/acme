name: ACME Invariant Gate
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit Pure NLP, Zero-Code & Registry Integrity
        run: |
          python -c "
          import os, json, sys

          # 1. Zero-Code Invariant: No code artifacts in core
          forbidden = ['.py', '.sh', '.exe', '.dll']
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              for f in files:
                  if os.path.splitext(f)[1].lower() in forbidden:
                      print(f'[FAIL] Code artifact found: {os.path.join(root, f)}')
                      sys.exit(1)

          # 2. Registry & Thesis Integrity
          with open('registry/graduates.json', 'r', encoding='utf-8') as fl:
              grads = json.load(fl)
          for g in grads:
              t_file = g['thesis_file']
              if not os.path.exists(t_file):
                  print(f'[FAIL] Missing thesis file: {t_file}')
                  sys.exit(1)

          # 3. Domain Purity Negative Gate
          prohibited = ['UYAP', 'TCKN', 'UDF']
          for root, dirs, files in os.walk('theses'):
              for f in files:
                  if f.endswith('.md'):
                      c = open(os.path.join(root, f), 'r', encoding='utf-8').read()
                      for p in prohibited:
                          if p in c:
                              print(f'[FAIL] Domain purity breach ({p}) in {f}')
                              sys.exit(1)

          print('[PASS] All ACME Core pure NLP invariants verified.')
          "