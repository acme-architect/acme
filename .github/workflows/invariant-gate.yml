name: ACME Invariant Gate
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit Pure NLP, Zero-Code, Constitutional Integrity & Pre-Flight Gates
        run: |
          python -c "
          import os, json, sys, re, subprocess

          # 1. Zero-Code Invariant: No code artifacts tracked in core
          forbidden = ['.py', '.sh', '.exe', '.dll']
          try:
              tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
              for f in tracked:
                  if os.path.splitext(f)[1].lower() in forbidden:
                      print(f'[FAIL] Code artifact tracked in git: {f}')
                      sys.exit(1)
          except Exception:
              for root, dirs, files in os.walk('.'):
                  if '.git' in dirs: dirs.remove('.git')
                  if 'tools' in dirs: dirs.remove('tools')
                  if 'extensions' in dirs: dirs.remove('extensions')
                  for f in files:
                      if os.path.splitext(f)[1].lower() in forbidden:
                          print(f'[FAIL] Code artifact found: {os.path.join(root, f)}')
                          sys.exit(1)

          # 2. Registry & Thesis Integrity
          with open('registry/graduates.json', 'r', encoding='utf-8') as fl:
              grads = json.load(fl)
          for g in grads:
              t_file = g['thesis_file']
              if not os.path.exists(t_file):
                  print(f'[FAIL] Missing thesis file: {t_file}')
                  sys.exit(1)

          # 3. Domain Purity Negative Gate
          prohibited = ['UYAP', 'TCKN', 'UDF']
          for root, dirs, files in os.walk('theses'):
              for f in files:
                  if f.endswith('.md'):
                      c = open(os.path.join(root, f), 'r', encoding='utf-8').read()
                      for p in prohibited:
                          if p in c:
                              print(f'[FAIL] Domain purity breach ({p}) in {f}')
                              sys.exit(1)

          # 4. Constitutional Integrity & Invariant Parity Gate
          const_text = open('CONSTITUTION.md', 'r', encoding='utf-8').read()
          required_invariants = [
              'REJECT_SCOPE_EVASION',
              'REJECT_EXTREME_ENTROPY',
              'REJECT_SPECULATIVE_STATE',
              'QUARANTINE_AND_LOG',
              'INV-SINGLE-MANIFEST',
              'INV-OPTIN-STRICT',
              'Dewdrop Boundary Invariant',
              'Biological Primacy'
          ]
          for inv in required_invariants:
              if inv not in const_text:
                  print(f'[FAIL] Missing core constitutional invariant: {inv}')
                  sys.exit(1)

          # 5. Pre-flight Circuit Breaker for Task Specifications (specs/)
          banned_fluff = [
              'hızlı', 'şık', 'kolay', 'performanslı', 'güzel', 'kaliteli', 'efsane',
              'easy', 'beautiful'
          ]
          if os.path.exists('specs'):
              for root, dirs, files in os.walk('specs'):
                  for f in files:
                      if f.endswith('.md'):
                          p = os.path.join(root, f)
                          c = open(p, 'r', encoding='utf-8').read()
                          if not re.search(r'##\s*(?:NEGATİF KISITLAR|VIA NEGATIVA|INVARIANTS|THE LEX)', c, re.IGNORECASE):
                              print(f'[FAIL] Spec lacks Via Negativa: {p}')
                              sys.exit(1)
                          if not re.search(r'-\s*\[\s*\]\s*(?:assert|exit code|SHA|p95|<=|==|>=)', c, re.IGNORECASE):
                              print(f'[FAIL] Spec lacks binary DoD assertions: {p}')
                              sys.exit(1)

          print('[PASS] All ACME Core pure NLP invariants and CI/CD gates verified.')
          "
